# Base Environment for Databricks Serverless Notebooks
# Core dependencies for data engineering and ML workflows
#
# Note: Databricks serverless requires dependencies as a flat list of pip packages (no Conda format)

environment_version: '4'

dependencies:
  - mlflow>=3.0.0
  - databricks-feature-engineering>=0.2.0
  - pandas>=1.5.0
  - numpy>=1.24.0
  - scikit-learn>=1.3.0
