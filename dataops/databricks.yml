# This is a Databricks asset bundle definition for fashion_rec_dataops.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: fashion_rec_dataops
  uuid: ed081aa8-247c-41ca-918b-1ced34f39291

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  catalog_name:
    description: Unity Catalog name
  schema_name:
    description: Schema name (environment-specific)
  volume_path:
    description: Path to data volume
  experiment_data:
    description: Experiment for data pipeline runs

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
    variables:
      catalog: jongseob_demo
      schema: fashion_recommendations
      catalog_name: jongseob_demo
      schema_name: dev_fashion_recommendations
      volume_path: /Volumes/jongseob_demo/fashion_recommendations/data
      experiment_data: /Users/${workspace.current_user.userName}/experiments/fashion-recs-dev_data
  prod:
    mode: production
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/jongseob.jeon@databricks.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jongseob.jeon@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: jongseob_demo
      schema: fashion_recommendations
      catalog_name: jongseob_demo
      schema_name: prod_fashion_recommendations
      volume_path: /Volumes/jongseob_demo/fashion_recommendations/data
      experiment_data: /Shared/experiments/fashion-recs-prod_data
    permissions:
      - user_name: jongseob.jeon@databricks.com
        level: CAN_MANAGE
