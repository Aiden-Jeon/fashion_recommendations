# Data Pipeline Workflow: Load data, create features, and sync to Lakebase
# Runs: 01_load_data -> 02_create_features -> 03_create_synced_tables
# 
# Uses serverless compute with managed environments for all tasks
resources:
  jobs:
    data_pipeline_job:
      name: ${bundle.target}-fashion-recs-data-pipeline

      environments:
        - environment_key: base_core_env
          spec:
            dependencies:
              - ../environments/base-core.yml

      tasks:
        # Task 1: Load raw data to bronze tables - uses serverless compute with base-core environment
        - task_key: load_data
          notebook_task:
            notebook_path: ../src/01_load_data.ipynb
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              volume_path: ${var.volume_path}
              experiment_name: ${var.experiment_data}
          environment_key: base_core_env
          timeout_seconds: 3600

        # Task 2: Create features (depends on load_data) - uses serverless compute with base-core environment
        - task_key: create_features
          depends_on:
            - task_key: load_data
          notebook_task:
            notebook_path: ../src/02_create_features.ipynb
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
          environment_key: base_core_env
          timeout_seconds: 3600

        # Task 3: Create synced tables (depends on create_features) - uses serverless compute with base-core environment
        - task_key: create_synced_tables
          depends_on:
            - task_key: create_features
          notebook_task:
            notebook_path: ../src/03_create_synced_tables.ipynb
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
          environment_key: base_core_env
          timeout_seconds: 3600

      # Manual trigger for now (no schedule)
      # Can add schedule later:
      # schedule:
      #   quartz_cron_expression: "0 0 2 * * ?"  # Daily at 2am
      #   timezone_id: UTC

      max_concurrent_runs: 1
      timeout_seconds: 7200

      tags:
        project: fashion_recommendations
        stage: ${bundle.target}
        pipeline: data_pipeline

      permissions:
        - level: CAN_VIEW
          group_name: users
        - level: CAN_MANAGE_RUN
          group_name: users

