{% extends "base.html" %}

{% block title %}시계열 분석 - Fashion Dashboard{% endblock %}

{% block sidebar %}
<aside class="filters-panel">
    <details class="filters-toggle" open>
        <summary>필터</summary>
        <form method="get" class="filters-form">
            <label>
                시작 날짜
                <input type="date" name="start_date" value="{{ filters.start_date }}">
            </label>
            
            <label>
                종료 날짜
                <input type="date" name="end_date" value="{{ filters.end_date }}">
            </label>
            
            <label>
                집계 단위
                <select name="granularity">
                    {% for gran in granularities %}
                    <option value="{{ gran }}" {% if gran == filters.granularity %}selected{% endif %}>
                        {% if gran == "daily" %}일별
                        {% elif gran == "weekly" %}주별
                        {% else %}월별{% endif %}
                    </option>
                    {% endfor %}
                </select>
            </label>
            
            <div class="filter-actions">
                <button type="submit" class="button primary">필터 적용</button>
                <a class="button secondary" href="/timeseries">초기화</a>
            </div>
        </form>
    </details>
</aside>
{% endblock %}

{% block content %}
<div class="content-header">
    <div class="content-title">
        <h2>시계열 분석</h2>
    </div>
</div>

<div class="charts-container">
    <div class="chart-section full-width">
        <div class="chart-wrapper">
            {{ revenue_chart | safe }}
        </div>
    </div>
    
    <div class="chart-section full-width">
        <div class="chart-wrapper">
            {{ transactions_chart | safe }}
        </div>
    </div>
    
    <div class="chart-section full-width">
        <div class="chart-wrapper">
            {{ customers_chart | safe }}
        </div>
    </div>
</div>
{% endblock %}
