[project]
name = "fashion-recommendations"
version = "0.1.0"
description = "Fashion Recommendations MLOps Project for Databricks"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"

# Core production dependencies - minimal set for Databricks serverless
dependencies = [
    "mlflow>=3.0.0",
    "databricks-feature-engineering>=0.2.0",
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
# Visualization dependencies - only install when needed for analysis
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

# Development dependencies - testing, linting, etc.
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

# All optional dependencies combined
all = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# Poetry-specific configuration
name = "fashion-recommendations"
version = "0.1.0"
description = "Fashion Recommendations MLOps Project for Databricks"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "training"}, {include = "data_engineering"}, {include = "utils"}, {include = "config"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
mlflow = ">=3.0.0"
databricks-feature-engineering = ">=0.2.0"
pandas = ">=1.5.0"
numpy = ">=1.24.0"
scikit-learn = ">=1.3.0"

[tool.poetry.group.viz]
optional = true

[tool.poetry.group.viz.dependencies]
matplotlib = ">=3.7.0"
seaborn = ">=0.12.0"

[tool.poetry.group.dl]
optional = true

[tool.poetry.group.dl.dependencies]
torch = ">=2.0.0"
torchvision = ">=0.15.0"
tqdm = ">=4.65.0"
databricks-sdk = ">=0.17.0"

[tool.poetry.group.dev]
optional = false

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
