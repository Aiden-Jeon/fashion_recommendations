# ML Artifacts: Experiments and Models
resources:
  # Unity Catalog Schema
  schemas:
    fashion_recommendations_schema:
      name: ${var.schema_name}
      catalog_name: ${var.catalog_name}
      comment: "Schema for fashion recommendations MLOps project - contains models and tables"
      grants:
        - privileges: [USE_SCHEMA]
          principal: account users

  # MLflow Experiments
  experiments:
    data_pipeline_experiment:
      name: ${var.experiment_data}
      permissions:
        - level: CAN_READ
          group_name: users

    models_experiment:
      name: ${var.experiment_models}
      permissions:
        - level: CAN_READ
          group_name: users

