# Batch Inference Job
# Generates recommendations for all customers

resources:
  jobs:
    batch_inference:
      name: "[${bundle.target}] Fashion Recommendations - Batch Inference"

      job_clusters:
        - job_cluster_key: inference_cluster
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: ${var.max_workers}
            autoscale:
              min_workers: 2
              max_workers: ${var.max_workers}
            custom_tags:
              project: fashion_recommendations
              pipeline: inference
              environment: ${bundle.target}

      tasks:
        # Task 1: Generate Recommendations
        - task_key: generate_recommendations
          job_cluster_key: inference_cluster
          notebook_task:
            notebook_path: ../notebooks/09_model_deployment
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              model_name: ensemble_blend
              model_stage: Production
          libraries:
            - pypi:
                package: mlflow>=2.9.0

        # Task 2: Validate Recommendations
        - task_key: validate_recommendations
          depends_on:
            - task_key: generate_recommendations
          job_cluster_key: inference_cluster
          python_wheel_task:
            package_name: fashion_recommendations
            entry_point: validate_predictions
            parameters:
              - "--catalog-name=${var.catalog_name}"
              - "--schema-name=${var.schema_name}"

        # Task 3: Export to Gold Table
        - task_key: export_to_gold
          depends_on:
            - task_key: validate_recommendations
          job_cluster_key: inference_cluster
          python_wheel_task:
            package_name: fashion_recommendations
            entry_point: export_recommendations
            parameters:
              - "--catalog-name=${var.catalog_name}"
              - "--schema-name=${var.schema_name}"
              - "--target-table=customer_recommendations_gold"

      # Schedule: Run daily after training completes
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"  # 6 AM UTC
        timezone_id: "UTC"
        pause_status: UNPAUSED

      # Email notifications
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      # Max concurrent runs
      max_concurrent_runs: 1

      # Timeout: 2 hours
      timeout_seconds: 7200

      tags:
        pipeline: inference
        environment: ${bundle.target}
