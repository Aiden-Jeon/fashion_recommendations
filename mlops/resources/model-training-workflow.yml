# Model Training Workflow: Train all recommendation models
resources:
  jobs:
    model_training_job:
      name: ${bundle.target}-fashion-recs-model-training

      environments:
        # Core environment for basic models (popularity)
        - environment_key: core_env
          spec:
            dependencies:
              - ../environments/base-core.yml

        # Visualization environment for models needing plots (age_rules, ensemble)
        - environment_key: viz_env
          spec:
            dependencies:
              - ../environments/base-viz.yml

        # Deep learning environment for LSTM model
        - environment_key: dl_env
          spec:
            dependencies:
              - ../environments/base-dl.yml

      tasks:
        # Train Popularity Baseline Model - uses core environment
        - task_key: train_popularity
          notebook_task:
            notebook_path: ../training/notebooks/train_popularity.ipynb
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              experiment_name: ${var.experiment_models}
              model_name: ${var.model_popularity}
          environment_key: viz_env

        # Train Age-Based Rules Model - uses visualization environment
        - task_key: train_age_rules
          notebook_task:
            notebook_path: ../training/notebooks/train_age_rules.ipynb
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              experiment_name: ${var.experiment_models}
              model_name: ${var.model_age_rules}
          environment_key: viz_env

        # Train LSTM Model - Uses Serverless GPU (A10) with deep learning environment
        # Note: Serverless GPU configuration is handled inside the notebook using @distributed decorator
        - task_key: train_lstm
          notebook_task:
            notebook_path: ../training/notebooks/train_lstm.ipynb
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              experiment_name: ${var.experiment_models}
              model_name: ${var.model_lstm}
              num_gpus: "8"
              gpu_type: "A10"
          environment_key: dl_env

        # Train Ensemble Model (depends on all base models) - uses visualization environment
        - task_key: train_ensemble
          depends_on:
            - task_key: train_popularity
            - task_key: train_age_rules
            - task_key: train_lstm
          notebook_task:
            notebook_path: ../training/notebooks/train_ensemble.ipynb
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              experiment_name: ${var.experiment_models}
              model_name: ${var.model_ensemble}
          environment_key: viz_env

      # Manual trigger for now
      # schedule:
      #   quartz_cron_expression: "0 0 9 * * ?"  # Daily at 9am
      #   timezone_id: UTC

      permissions:
        - level: CAN_VIEW
          group_name: users
        - level: CAN_MANAGE_RUN
          group_name: users
