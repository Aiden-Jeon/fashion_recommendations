# Model Training Workflow: Train all recommendation models
resources:
  jobs:
    model_training_job:
      name: ${bundle.target}-fashion-recs-model-training

      environments:
        # Core environment for basic models
        - environment_key: core_env
          spec:
            client: "1"
            dependencies:
              - ../environments/base-core.yml

        # Visualization environment for models needing plots
        - environment_key: viz_env
          spec:
            client: "1"
            dependencies:
              - ../environments/base-viz.yml

        # Deep learning environment for neural network models
        - environment_key: dl_env
          spec:
            client: "1"
            dependencies:
              - ../environments/base-dl.yml

      tasks:
        # Train Popularity Baseline Model
        - task_key: train_popularity
          notebook_task:
            notebook_path: ../training/notebooks/train_popularity.ipynb
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              experiment_name: ${var.experiment_models}
              model_name: ${var.model_popularity}
          environment_key: viz_env

        # Train Age-Based Rules Model
        - task_key: train_age_rules
          notebook_task:
            notebook_path: ../training/notebooks/train_age_rules.ipynb
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              experiment_name: ${var.experiment_models}
              model_name: ${var.model_age_rules}
          environment_key: viz_env

        # Train Simple MLP Model - Uses GPU-optimized databricks_ai_v4 environment
        # Note: GPU environment configured in notebook metadata
        # - task_key: train_simple_mlp
        #   notebook_task:
        #     notebook_path: ../training/notebooks/train_simple_mlp.ipynb
        #     base_parameters:
        #       catalog_name: ${var.catalog_name}
        #       schema_name: ${var.schema_name}
        #       experiment_name: ${var.experiment_models}
        #       model_name: ${var.model_simple_mlp}
        #   environment_key: dl_env

        # Train Ensemble Model (depends on all base models)
        - task_key: train_ensemble
          depends_on:
            - task_key: train_popularity
            - task_key: train_age_rules
          notebook_task:
            notebook_path: ../training/notebooks/train_ensemble.ipynb
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
              experiment_name: ${var.experiment_models}
              model_name: ${var.model_ensemble}
          environment_key: viz_env

      # Manual trigger for now
      # schedule:
      #   quartz_cron_expression: "0 0 9 * * ?"  # Daily at 9am
      #   timezone_id: UTC

      permissions:
        - level: CAN_VIEW
          group_name: users
        - level: CAN_MANAGE_RUN
          group_name: users
