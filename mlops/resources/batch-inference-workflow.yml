# Batch Inference Workflow: Generate recommendations for all customers
# This workflow loads all models with Champion alias from Unity Catalog
# and generates predictions to model-specific gold tables
resources:
  jobs:
    batch_inference_job:
      name: ${bundle.target}-fashion-recs-batch-inference

      environments:
        - environment_key: core_env
          spec:
            dependencies:
              - ../environments/base-core.yml

      tasks:
        - task_key: batch_inference
          notebook_task:
            notebook_path: ../deployment/batch_inference/notebooks/batch_inference.ipynb
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
          environment_key: core_env

      # Manual trigger for now
      # Uncomment to enable daily scheduled execution
      # schedule:
      #   quartz_cron_expression: "0 0 11 * * ?"  # Daily at 11am UTC
      #   timezone_id: UTC

      permissions:
        - level: CAN_VIEW
          group_name: users
        - level: CAN_MANAGE_RUN
          group_name: users
