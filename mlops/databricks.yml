# Databricks Asset Bundle Configuration for Fashion Recommendations MLOps Project
bundle:
  name: fashion_recommendations_mlops

variables:
  # Experiments (environment-specific by deploy target: dev/staging/prod)
  # Dev uses per-user folder, staging/prod use shared folder
  experiment_data:
    description: Experiment for data pipeline runs
    default: /Users/${workspace.current_user.userName}/experiments/fashion-recs-dev_data

  experiment_models:
    description: Experiment for model training runs
    default: /Users/${workspace.current_user.userName}/experiments/fashion-recs-dev_models

  # Unity Catalog (single catalog, schema per environment)
  catalog_name:
    description: Unity Catalog name
    default: shared

  schema_name:
    description: Schema name (environment-specific)
    default: fashion_recommendations

  # Volume path
  volume_path:
    description: Path to data volume
    default: /Volumes/shared/fashion_recommendations/data

  # Models (simple names - will be registered in catalog.schema)
  model_popularity:
    description: Popularity baseline model
    default: popularity_model

  model_age_rules:
    description: Age-based rules model
    default: age_rules_model

  model_lstm:
    description: LSTM sequential model
    default: lstm_model

  model_ensemble:
    description: Ensemble blend model
    default: ensemble_model

# Include resource definitions
include:
  - ./resources/feature-engineering-workflow.yml
  - ./resources/model-training-workflow.yml
  - ./resources/batch-inference-workflow.yml
  - ./resources/model-deployment-workflow.yml

# Environment targets
targets:
  # Development environment (per-user experiments)
  dev:
    mode: production
    default: true
    workspace:
      host: https://e2-demo-west.cloud.databricks.com/
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      # Per-user experiments for dev (bundle resolves ${workspace.current_user.userName} correctly)
      experiment_data: /Users/${workspace.current_user.userName}/experiments/fashion-recs-dev_data
      experiment_models: /Users/${workspace.current_user.userName}/experiments/fashion-recs-dev_models

  # Staging environment
  staging:
    mode: production
    workspace:
      host: https://e2-demo-west.cloud.databricks.com/
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      experiment_data: /Shared/experiments/fashion-recs-staging_data
      experiment_models: /Shared/experiments/fashion-recs-staging_models

  # Production environment
  prod:
    mode: production
    workspace:
      host: https://e2-demo-west.cloud.databricks.com/
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      experiment_data: /Shared/experiments/fashion-recs-prod_data
      experiment_models: /Shared/experiments/fashion-recs-prod_models
